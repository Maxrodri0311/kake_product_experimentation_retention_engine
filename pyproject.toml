[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kake-product-data-scientist-bridge-project"
version = "0.1.0"
description = "GP-123 - Kake Product Experimentation & Retention Engine: CUPED Causal Variance Reduction and Weibull Survival Analysis for Onboarding Drop-off Mitigation"
authors = [
    { name = "Maximiliano Rodriguez", email = "candidate@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "pytest>=7.3.0",
    "lifelines>=0.28.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]